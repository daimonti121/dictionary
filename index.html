<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мій Словник</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 3D Flip ефект для карток */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .card-inner { transition: transform 0.5s; }
        .flipped .card-inner { transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">

    <div class="max-w-2xl mx-auto p-4 pt-10">
        <h1 class="text-3xl font-bold text-center mb-8 text-blue-600">Мій Словник</h1>

        <!-- Форма додавання слова -->
        <div class="bg-white p-6 rounded-2xl shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4">Додати нове слово</h2>
            <form id="add-word-form" class="flex flex-col gap-4">
                <input type="text" id="eng-input" placeholder="Англійською (напр. Warehouse)" required
                    class="p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                
                <input type="text" id="trans-input" placeholder="Транскрипція (необов'язково)"
                    class="p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                
                <input type="text" id="ukr-input" placeholder="Українською (напр. Склад)" required
                    class="p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                
                <button type="submit" id="submit-btn"
                    class="bg-blue-600 text-white font-semibold p-3 rounded-lg hover:bg-blue-700 transition">
                    Додати слово
                </button>
            </form>
        </div>

        <!-- Кнопка тренування -->
        <div class="flex justify-center mb-8">
            <button id="practice-btn" class="bg-green-500 text-white font-bold py-3 px-8 rounded-full shadow-lg hover:bg-green-600 transition transform hover:scale-105">
                Повторити слова
            </button>
        </div>

        <!-- Список слів -->
        <div class="bg-white p-6 rounded-2xl shadow-md">
            <h2 class="text-xl font-semibold mb-4">Мій список (<span id="word-count">0</span>)</h2>
            <div id="loading-msg" class="text-gray-500 mb-4">Завантаження слів із бази даних...</div>
            <ul id="word-list" class="flex flex-col gap-3">
                <!-- Слова будуть додаватися сюди через JS -->
            </ul>
        </div>
    </div>

    <!-- Модальне вікно для карток -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-80 hidden flex-col justify-center items-center p-4 z-50">
        <button id="close-modal" class="absolute top-6 right-6 text-white text-4xl hover:text-gray-300">&times;</button>
        
        <div class="text-white mb-4 text-lg">Картка <span id="current-card-num">1</span> з <span id="total-cards-num">10</span></div>

        <!-- Сама флеш-картка -->
        <div id="flashcard" class="w-full max-w-sm h-64 perspective-1000 cursor-pointer">
            <div class="card-inner relative w-full h-full transform-style-3d">
                
                <!-- Передня сторона (Англійська) -->
                <div class="absolute w-full h-full backface-hidden bg-white rounded-2xl shadow-2xl flex flex-col justify-center items-center p-6 text-center">
                    <span class="text-4xl font-bold text-gray-800" id="card-eng"></span>
                    <span class="text-xl text-blue-500 mt-3 font-mono" id="card-trans"></span>
                    <span class="text-sm text-gray-400 mt-6">(Натисни, щоб перевернути)</span>
                </div>
                
                <!-- Задня сторона (Українська) -->
                <div class="absolute w-full h-full backface-hidden bg-blue-600 rounded-2xl shadow-2xl flex flex-col justify-center items-center p-6 text-center rotate-y-180">
                    <span class="text-4xl font-bold text-white" id="card-ukr"></span>
                </div>

            </div>
        </div>

        <!-- Керування картками -->
        <div class="flex gap-4 mt-8">
            <button id="prev-btn" class="bg-white text-gray-800 font-bold py-2 px-4 rounded-lg hover:bg-gray-200 transition">Назад</button>
            <button id="shuffle-btn" class="bg-yellow-400 text-gray-900 font-bold py-2 px-4 rounded-lg shadow-md hover:bg-yellow-500 transition">Перемешать</button>
            <button id="next-btn" class="bg-white text-gray-800 font-bold py-2 px-4 rounded-lg hover:bg-gray-200 transition">Вперед</button>
        </div>
    </div>

    <!-- Firebase та Логіка -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp, orderBy, query } 
            from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAtcJLMY9jIiKpOCK-qR3euD3ToUoH5AWY",
            authDomain: "dictionary-4d165.firebaseapp.com",
            projectId: "dictionary-4d165",
            storageBucket: "dictionary-4d165.firebasestorage.app",
            messagingSenderId: "619512208362",
            appId: "1:619512208362:web:f3990b11cea9d9432df093"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let words = [];
        let practiceWords = [];
        let currentCardIndex = 0;

        // Елементи DOM
        const form = document.getElementById('add-word-form');
        const engInput = document.getElementById('eng-input');
        const transInput = document.getElementById('trans-input');
        const ukrInput = document.getElementById('ukr-input');
        const wordList = document.getElementById('word-list');
        const wordCount = document.getElementById('word-count');
        const loadingMsg = document.getElementById('loading-msg');
        const submitBtn = document.getElementById('submit-btn');

        // Модальне вікно
        const modal = document.getElementById('modal');
        const closeModalBtn = document.getElementById('close-modal');
        const practiceBtn = document.getElementById('practice-btn');
        const flashcard = document.getElementById('flashcard');
        const cardEng = document.getElementById('card-eng');
        const cardTrans = document.getElementById('card-trans');
        const cardUkr = document.getElementById('card-ukr');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const currentNum = document.getElementById('current-card-num');
        const totalNum = document.getElementById('total-cards-num');

        // Завантаження слів із бази даних Firestore
        async function loadWords() {
            words = [];
            try {
                const q = query(collection(db, "words"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                querySnapshot.forEach((doc) => {
                    words.push({ id: doc.id, ...doc.data() });
                });
                loadingMsg.style.display = 'none';
                renderList();
            } catch (error) {
                console.error("Помилка завантаження:", error);
                loadingMsg.innerText = "Помилка завантаження. Перевір налаштування Firestore (Test mode).";
            }
        }

        // Відображення списку слів
        function renderList() {
            wordList.innerHTML = '';
            wordCount.innerText = words.length;

            if (words.length === 0) {
                wordList.innerHTML = '<li class="text-gray-400 text-center py-4">Словник порожній. Додай перше слово!</li>';
                return;
            }

            words.forEach((word) => {
                const li = document.createElement('li');
                li.className = 'flex items-center justify-between bg-gray-50 p-3 rounded-lg border border-gray-200';
                
                const transcriptionHtml = word.transcription ? `<span class="text-blue-500 font-mono text-sm ml-2">[${word.transcription}]</span>` : '';
                
                li.innerHTML = `
                    <div class="flex items-center">
                        <button class="delete-btn bg-red-100 hover:bg-red-200 text-red-500 p-2 rounded-md transition mr-3" data-id="${word.id}" title="Видалити">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                        <div>
                            <span class="font-bold text-lg">${word.english}</span>
                            ${transcriptionHtml}
                            <div class="text-gray-600 pl-[3.2rem] -mt-1">${word.ukrainian}</div>
                        </div>
                    </div>
                `;
                wordList.appendChild(li);
            });

            // Додаємо подію видалення
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = e.target.getAttribute('data-id');
                    await deleteWordFromDB(id);
                });
            });
        }

        // Додавання слова
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const eng = engInput.value.trim();
            let trans = transInput.value.trim();
            const ukr = ukrInput.value.trim();

            if (trans && !trans.startsWith('[')) trans = '[' + trans;
            if (trans && !trans.endsWith(']')) trans = trans + ']';
            trans = trans.replace(/\[|\]/g, ''); // Зберігаємо чистий текст, дужки підставляє код

            submitBtn.innerText = 'Додаю...';
            submitBtn.disabled = true;

            try {
                const docRef = await addDoc(collection(db, "words"), {
                    english: eng,
                    transcription: trans,
                    ukrainian: ukr,
                    createdAt: serverTimestamp()
                });
                
                words.unshift({ id: docRef.id, english: eng, transcription: trans, ukrainian: ukr });
                renderList();
                
                engInput.value = '';
                transInput.value = '';
                ukrInput.value = '';
            } catch (error) {
                console.error("Помилка збереження:", error);
                alert("Помилка збереження. Перевір правила бази даних (Firestore).");
            } finally {
                submitBtn.innerText = 'Додати слово';
                submitBtn.disabled = false;
            }
        });

        // Видалення слова
        async function deleteWordFromDB(id) {
            try {
                await deleteDoc(doc(db, "words", id));
                words = words.filter(w => w.id !== id);
                renderList();
            } catch (error) {
                console.error("Помилка видалення:", error);
            }
        }

        // --- ЛОГІКА ФЛЕШ-КАРТОК --- //
        
        function shuffleArray(array) {
            let curId = array.length;
            while (0 !== curId) {
                let randId = Math.floor(Math.random() * curId);
                curId -= 1;
                let tmp = array[curId];
                array[curId] = array[randId];
                array[randId] = tmp;
            }
            return array;
        }

        practiceBtn.addEventListener('click', () => {
            if (words.length === 0) {
                alert("Спершу додай слова до словника!");
                return;
            }
            practiceWords = shuffleArray([...words]);
            currentCardIndex = 0;
            updateCard();
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        });

        closeModalBtn.addEventListener('click', () => {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            flashcard.classList.remove('flipped');
        });

        flashcard.addEventListener('click', () => {
            flashcard.classList.toggle('flipped');
        });

        function updateCard() {
            flashcard.classList.remove('flipped');
            const word = practiceWords[currentCardIndex];
            
            setTimeout(() => {
                cardEng.innerText = word.english;
                cardTrans.innerText = word.transcription ? `[${word.transcription}]` : '';
                cardUkr.innerText = word.ukrainian;
                currentNum.innerText = currentCardIndex + 1;
                totalNum.innerText = practiceWords.length;
            }, 150);
        }

        nextBtn.addEventListener('click', () => {
            if (currentCardIndex < practiceWords.length - 1) {
                currentCardIndex++;
                updateCard();
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentCardIndex > 0) {
                currentCardIndex--;
                updateCard();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (!modal.classList.contains('hidden')) {
                if (e.key === 'ArrowRight') nextBtn.click();
                if (e.key === 'ArrowLeft') prevBtn.click();
                if (e.key === ' ' || e.key === 'Enter') {
                    e.preventDefault();
                    flashcard.click();
                }
                if (e.key === 'Escape') closeModalBtn.click();
            }
        });

        shuffleBtn.addEventListener('click', () => {
            practiceWords = shuffleArray(practiceWords);
            currentCardIndex = 0;
            updateCard();
        });

        // Запуск
        loadWords();
    </script>
</body>
</html>
